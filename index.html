<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta charset="UTF-8" />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
      integrity="<sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk>"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles/styles.css" />
    <title>Registro Clientes</title>
  </head>
  <body style="overflow-x: hidden">
    <!-- Aviso si no se pudo cargar el catálogo del backend -->
    <div id="errorCatalogo" class="alert alert-danger m-3" style="display: none"></div>

    <form id="formulario" onsubmit="return false;" novalidate>
      <!-- Trampa para bots: una persona nunca la ve ni la llena -->
      <div style="position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden" aria-hidden="true">
        <label for="sitioWeb">Sitio web</label>
        <input id="sitioWeb" name="sitioWeb" type="text" tabindex="-1" autocomplete="off" />
      </div>

      <!--Leyenda y cuadro datos de contacto-->

      <fieldset class="border p-2">
        <legend class="w-auto" style="margin-left: 50px; font-size: large">Datos de Contacto</legend>

        <div class="row g-3 align-items-center">
          <label for="nombreContacto" class="col-sm-2 col-form-label offset-md-1" style="margin-right: 12px"
            >Nombre de Contacto:</label
          >
          <input
            id="nombreContacto"
            name="nombreContacto"
            class="form-control col-sm-4"
            type="text"
            maxlength="200"
            placeholder="Ingrese un nombre de contacto"
          />
        </div>

        <div class="row g-3 align-items-center">
          <label for="telefonoContacto" class="col-sm-2 col-form-label offset-md-1" style="margin-right: 12px"
            >Telefono de Contacto:</label
          >
          <input
            id="telefonoContacto"
            name="telefonoContacto"
            class="form-control col-sm-4"
            type="tel"
            maxlength="20"
            placeholder="Ingrese un telefono de contacto"
          />
        </div>

        <div class="row g-3 align-items-center">
          <label for="emailContacto" class="col-sm-2 col-form-label offset-md-1" style="margin-right: 12px"
            >Email de Contacto:</label
          >
          <input
            id="emailContacto"
            name="emailContacto"
            class="form-control col-sm-4"
            type="email"
            maxlength="200"
            placeholder="Ingrese un email de contacto"
          />
        </div>
      </fieldset>

      <!--Leyenda y cuadro datos Cliente. Las opciones de las listas llegan de GET /formulario-->

      <fieldset class="border p-2">
        <legend class="w-auto" style="margin-left: 50px; font-size: large">Datos Cliente</legend>

        <!--Fila División Comercial -->
        <div class="row g-3 align-items-center">
          <label for="division_comercial" class="col-sm-2 col-form-label offset-md-1">División Comercial</label>
          <div class="col-sm-4">
            <select
              id="division_comercial"
              name="division_comercial"
              onchange="divisionOnchange(this)"
              class="form-control"
            ></select>
          </div>
        </div>

        <!--Fila Tipo Registro -->
        <div class="row g-3 align-items-center">
          <label for="t_registro" class="col-sm-2 col-form-label offset-md-1">Tipo de registro</label>
          <div class="col-sm-4">
            <select id="t_registro" name="t_registro" class="form-control"></select>
          </div>
        </div>

        <!--Fila Tipo Cliente -->
        <div class="row g-3 align-items-center">
          <label for="t_cliente" class="col-sm-2 col-form-label offset-md-1">Tipo de Cliente</label>
          <div class="col-sm-4">
            <select id="t_cliente" name="t_cliente" class="form-control" onchange="tipodeClienteOnchange(this)"></select>
          </div>
        </div>

        <!--Fila Tipo Sociedad (para el exterior es "No aplica" y no se muestra) -->
        <div id="tipo_sociedad" class="row g-3 align-items-center" style="display: none">
          <label for="t_sociedad" class="col-sm-2 col-form-label offset-md-1">Tipo de Sociedad</label>
          <div class="col-sm-4">
            <select id="t_sociedad" name="t_sociedad" class="form-control" onchange="tipodeSociedadOnchange(this)"></select>
          </div>
        </div>

        <!--Fila Tipo Empresa -->
        <div class="row g-3 align-items-center">
          <label for="t_empresa" class="col-sm-2 col-form-label offset-md-1">Tipo de Empresa</label>
          <div class="col-sm-4">
            <select id="t_empresa" name="t_empresa" class="form-control"></select>
          </div>
        </div>

        <!--Fila Tamaño Empresa -->
        <div class="row g-3 align-items-center">
          <label for="tamano_empresa" class="col-sm-2 col-form-label offset-md-1">Tamaño de la Empresa</label>
          <div class="col-sm-4">
            <select id="tamano_empresa" name="tamano_empresa" class="form-control"></select>
          </div>
        </div>

        <!-- Fila para tipo y numero de identificacion-->
        <div class="row g-3 align-items-center">
          <!--Tipo de indentificación-->
          <label for="t_identificacion" class="col-sm-2 col-form-label offset-md-1">Tipo de identificación</label>
          <div class="col-sm-2">
            <select
              id="t_identificacion"
              name="t_identificacion"
              class="form-control"
              onchange="tipoindentificacionOnchange(this)"
            ></select>
          </div>
          <!--Cedula-->
          <div id="cedula" class="form-row col-md-6" style="display: none">
            <label for="cc" class="col-sm-1 col-form-label offset-md-1">Cédula:</label>
            <input
              id="cc"
              name="cc"
              class="form-control col-sm-6 offset-sm-1"
              type="text"
              inputmode="numeric"
              maxlength="20"
              placeholder="Ingrese su número de Cedula"
            />
          </div>

          <!-- NIT: el número va sin el dígito de verificación, que va en su propio campo -->
          <div id="nit" class="form-row col-md-6" style="display: none">
            <label for="numeroNIT" class="col-sm-1 col-form-label offset-md-1">NIT:</label>
            <input
              id="numeroNIT"
              name="numeroNIT"
              class="form-control col-sm-4"
              type="text"
              inputmode="numeric"
              maxlength="20"
              placeholder="NIT sin dígito de verificación"
            />
            <label for="codigoNIT" class="col-form-label" style="padding: 0 6px">DV</label>
            <input
              id="codigoNIT"
              name="codigoNIT"
              class="form-control col-sm-1"
              type="text"
              inputmode="numeric"
              maxlength="1"
              placeholder="DV"
            />
          </div>
        </div>

        <!-- Fila Nombre -->
        <div class="row g-3 align-items-center">
          <label for="nombreCliente" class="col-sm-2 col-form-label offset-md-1" style="margin-right: 12px"
            >Nombre de Cliente:</label
          >
          <input
            id="nombreCliente"
            name="nombreCliente"
            class="form-control col-sm-4"
            type="text"
            maxlength="200"
            placeholder="Ingrese su nombre cliente"
          />
        </div>

        <!-- Fila Condición de pago (opciones desde el catálogo) -->
        <div id="fila_credito" class="row g-3 align-items-center">
          <label class="col-sm-2 col-form-label offset-md-1">Condiciones de pago</label>
          <div id="condicionesPago" class="col-sm"></div>
          <!--Monto Requerido-->
          <div id="cupo" class="form-row col-md-6" style="display: none">
            <label for="cupo_requerido" class="col-form-label">Cupo de crédito solicitado:</label>
            <input
              id="cupo_requerido"
              name="cupo_requerido"
              class="form-control col-sm-4"
              type="text"
              placeholder="Ingrese el monto requerido"
              pattern="^\$\d{1,3}(,\d{3})*(\.\d+)?$"
              data-type="currency"
            />
          </div>
        </div>
      </fieldset>

      <!--Seccion Cargue de Documentos. Qué se pide y si es obligatorio lo decide documentosPorCaso-->

      <fieldset id="archivos" class="border p-2">
        <legend class="w-auto" style="margin-left: 50px; font-size: large">Cargue de Archivos</legend>
        <p id="ayudaArchivos" class="offset-md-1 small text-muted" style="display: none"></p>

        <div id="clienteNacional" class="container offset-md-1" style="display: none">
          <div class="row g-3 documento" data-campo="FormularioNacional">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="FormularioNacional" class="custom-file-input" id="file-FormularioNacional" />
                <label class="custom-file-label" for="file-FormularioNacional"
                  >Formulario de registro de Clientes debidamente firmado <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-FormularioNacional" class="col-md-8 small"></div>
          </div>

          <div class="row g-3 documento" data-campo="copiacedula">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="copiacedula" class="custom-file-input" id="file-copiacedula" />
                <label class="custom-file-label" for="file-copiacedula"
                  >Copia de la Cédula de Ciudadanía de representante legal (quien firma el documento)
                  <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-copiacedula" class="col-md-8 small"></div>
          </div>

          <div class="row g-3 documento" data-campo="copiaRut">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="copiaRut" class="custom-file-input" id="file-copiaRut" />
                <label class="custom-file-label" for="file-copiaRut"
                  >Copia del RUT no mayor a 90 días. <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-copiaRut" class="col-md-8 small"></div>
          </div>

          <div class="row g-3 documento" data-campo="camaracomercio">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="camaracomercio" class="custom-file-input" id="file-camaracomercio" />
                <label class="custom-file-label" for="file-camaracomercio"
                  >Certificación Camara y comercio de existencia y representación legal no mayor a 90 días.
                  <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-camaracomercio" class="col-md-8 small"></div>
          </div>

          <div class="row g-3 documento" data-campo="actaConsorcial">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="actaConsorcial" class="custom-file-input" id="file-actaConsorcial" />
                <label class="custom-file-label" for="file-actaConsorcial"
                  >Acta Consorcial <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-actaConsorcial" class="col-md-8 small"></div>
          </div>

          <div class="row g-3 documento" data-campo="certificacionesBASC">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="certificacionesBASC" class="custom-file-input" id="file-certificacionesBASC" />
                <label class="custom-file-label" for="file-certificacionesBASC"
                  >Copia de certificaciones que posea BASC, ISO, etc. <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-certificacionesBASC" class="col-md-8 small"></div>
          </div>

          <div class="row g-3 documento" data-campo="estadofinan">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="estadofinan" class="custom-file-input" id="file-estadofinan" />
                <label class="custom-file-label" for="file-estadofinan"
                  >Copia estados financieros comparativos a últimos dos años a 31 de Dic <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-estadofinan" class="col-md-8 small"></div>
          </div>

          <div class="row g-3 documento" data-campo="renta">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="renta" class="custom-file-input" id="file-renta" />
                <label class="custom-file-label" for="file-renta"
                  >Copia de declaración de renta del año anterior. <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-renta" class="col-md-8 small"></div>
          </div>

          <div class="row g-3 documento" data-campo="referenciaComercial">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="referenciaComercial" class="custom-file-input" id="file-referenciaComercial" />
                <label class="custom-file-label" for="file-referenciaComercial"
                  >Copia de referencia comercial del año en curso. <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-referenciaComercial" class="col-md-8 small"></div>
          </div>

          <div class="row g-3 documento" data-campo="referenciaBancaria">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="referenciaBancaria" class="custom-file-input" id="file-referenciaBancaria" />
                <label class="custom-file-label" for="file-referenciaBancaria"
                  >Copia de referencia bancaria del año en curso. <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-referenciaBancaria" class="col-md-8 small"></div>
          </div>
        </div>

        <div id="clienteExterior" class="container offset-md-1" style="display: none">
          <div class="row g-3 documento" data-campo="FormularioExterior">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="FormularioExterior" class="custom-file-input" id="file-FormularioExterior" />
                <label class="custom-file-label" for="file-FormularioExterior"
                  >Formulario de registro de Clientes debidamente firmado. <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-FormularioExterior" class="col-md-8 small"></div>
          </div>

          <div class="row g-3 documento" data-campo="copiacedulaExt">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="copiacedulaExt" class="custom-file-input" id="file-copiacedulaExt" />
                <label class="custom-file-label" for="file-copiacedulaExt"
                  >Copia de la Cédula de Ciudadanía de representante legal (quien firma el documento)
                  <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-copiacedulaExt" class="col-md-8 small"></div>
          </div>

          <div class="row g-3 documento" data-campo="registroTributario">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="registroTributario" class="custom-file-input" id="file-registroTributario" />
                <label class="custom-file-label" for="file-registroTributario"
                  >Copia del Registro tributario. <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-registroTributario" class="col-md-8 small"></div>
          </div>

          <div class="row g-3 documento" data-campo="CertificadoExistencia">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="CertificadoExistencia" class="custom-file-input" id="file-CertificadoExistencia" />
                <label class="custom-file-label" for="file-CertificadoExistencia"
                  >Certificado de existencia y representación legal no mayor a 90 días. <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-CertificadoExistencia" class="col-md-8 small"></div>
          </div>

          <div class="row g-3 documento" data-campo="certificacionesBASC">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="certificacionesBASC" class="custom-file-input" id="file-certificacionesBASCExt" />
                <label class="custom-file-label" for="file-certificacionesBASCExt"
                  >Copia de certificaciones que posea BASC, ISO, etc. <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div class="col-md-8 small"></div>
          </div>

          <div class="row g-3 documento" data-campo="estadofinanExt">
            <div class="col-md-8">
              <div class="custom-file">
                <input type="file" name="estadofinanExt" class="custom-file-input" id="file-estadofinanExt" />
                <label class="custom-file-label" for="file-estadofinanExt"
                  >Copia estados financieros comparativos de los últimos dos años a 31 de Dic <abbr class="obligatoriedad"></abbr
                ></label>
              </div>
            </div>
            <div id="estado-estadofinanExt" class="col-md-8 small"></div>
          </div>
        </div>
      </fieldset>

      <fieldset class="border p-2">
        <legend class="w-auto" style="margin-left: 50px; font-size: large">Contacto Progen</legend>
        <div class="row g-3 align-items-center">
          <label for="nombreContactoProgen" class="col-sm-2 col-form-label offset-md-1">Nombre Contacto:</label>
          <div class="col-sm-4">
            <select id="nombreContactoProgen" name="nombreContactoProgen" class="form-control">
              <option value="" disabled selected>Primero elige la división comercial</option>
            </select>
          </div>
        </div>

        <!-- Autorización de tratamiento de datos (texto desde autorizacionDatos.texto) -->
        <div class="row g-3">
          <div class="col-md-8 offset-md-1">
            <div class="form-check">
              <input id="aceptaTratamientoDatos" name="aceptaTratamientoDatos" class="form-check-input" type="checkbox" />
              <label id="textoAutorizacion" for="aceptaTratamientoDatos" class="form-check-label"></label>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-8 offset-md-1">
            <input
              style="margin-top: 3px; font-size: smaller"
              id="boton"
              type="button"
              class="btn btn-lg btn-success"
              data-toggle="modal"
              data-target="#exampleModal"
              onclick="validaciones()"
              value="Enviar Registro"
              disabled
            />
          </div>
        </div>
      </fieldset>

      <!--Modal para notificaciones-->

      <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="titulomensaje" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header" id="headermensaje">
              <h5 class="modal-title" id="titulomensaje">Cargando....</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div id="mensaje" class="modal-body">
              <img src="https://acegif.com/wp-content/uploads/loading-25.gif" alt="Cargando" width="50px" height="50px" />
              <span style="padding-left: 10px">Cargando...</span>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-success" data-dismiss="modal">OK</button>
            </div>
          </div>
        </div>
      </div>
    </form>

    <!-- Consulta de estado: la respuesta es siempre la misma; el estado llega al correo registrado -->

    <form id="formularioConsulta" onsubmit="consultarEstado(); return false;" novalidate>
      <fieldset class="border p-2">
        <legend class="w-auto" style="margin-left: 50px; font-size: large">Consultar estado de una solicitud</legend>
        <div class="row g-3 align-items-center">
          <label for="consultaTipoIdentificacion" class="col-sm-2 col-form-label offset-md-1">Tipo de identificación</label>
          <div class="col-sm-2">
            <select id="consultaTipoIdentificacion" class="form-control"></select>
          </div>
        </div>
        <div class="row g-3 align-items-center">
          <label for="consultaNumero" class="col-sm-2 col-form-label offset-md-1" style="margin-right: 12px"
            >Número (sin DV):</label
          >
          <input
            id="consultaNumero"
            class="form-control col-sm-4"
            type="text"
            inputmode="numeric"
            maxlength="22"
            placeholder="Número de identificación"
          />
        </div>
        <div class="row g-3 align-items-center">
          <label for="consultaCorreo" class="col-sm-2 col-form-label offset-md-1" style="margin-right: 12px"
            >Correo registrado:</label
          >
          <input
            id="consultaCorreo"
            class="form-control col-sm-4"
            type="email"
            maxlength="200"
            placeholder="Correo con el que hizo el registro"
          />
        </div>
        <div class="row">
          <div class="col-md-8 offset-md-1">
            <button id="botonConsulta" type="submit" class="btn btn-primary" style="font-size: smaller" disabled>
              Consultar estado
            </button>
            <div id="resultadoConsulta" class="small mt-2" role="status"></div>
          </div>
        </div>
      </fieldset>
    </form>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsearch.js@2/dist/cdn/docsearch.min.js"></script>
    <script
      src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
      integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI"
      crossorigin="anonymous"
    ></script>
    <script src="./js/config.js"></script>
    <script src="./js/formatos.js"></script>
    <script src="./js/onchange.js"></script>
    <script src="./js/validacionDocumentos.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/validaciones.js"></script>
  </body>
</html>
